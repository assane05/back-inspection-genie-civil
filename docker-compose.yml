services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: las
      POSTGRES_PASSWORD: las_dev_password
      POSTGRES_DB: las_inspections
    ports:
      - "5432:5432"
    volumes:
      - las_postgres_data:/var/lib/postgresql/data

volumes:
  las_postgres_data:
